name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Beget VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Начало автоматического деплоя на contact.sdmaf.ru..."
            
            # Переходим в директорию проекта
            cd /var/www/contact.sdmaf.ru
            
            # Получаем свежие коммиты
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            
            # Устанавливаем зависимости и собираем проект
            npm install
            npm run build
            
            # Обновляем права для веб-сервера Nginx
            chown -R www-data:www-data /var/www/contact.sdmaf.ru/dist
            chmod -R 755 /var/www/contact.sdmaf.ru/dist
            
            echo "🎉 Деплой успешно завершен! Сайт contact.sdmaf.ru обновлен."
