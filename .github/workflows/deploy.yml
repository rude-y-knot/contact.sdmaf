name: Deploy to Beget VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-contact-sdmaf
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Deploy to Beget VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Check deployment secrets
        id: secrets_check
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USERNAME: ${{ secrets.BEGET_USERNAME }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          if [ -z "$BEGET_HOST" ] || [ -z "$BEGET_USERNAME" ] || [ -z "$BEGET_SSH_KEY" ]; then
            echo "::warning::Секреты BEGET_HOST, BEGET_USERNAME или BEGET_SSH_KEY не заданы. Сборка прошла успешно, загрузка на VPS пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist atomically to Beget VPS
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USERNAME: ${{ secrets.BEGET_USERNAME }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          TARGET_DIR: /var/www/contact.sdmaf.ru
        run: |
          set -euo pipefail

          PORT="${BEGET_PORT:-22}"

          # Подготовка SSH-ключа
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keyscan -p "$PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/beget_deploy_key -p $PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          SCP_OPTS="-i ~/.ssh/beget_deploy_key -P $PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          # Упаковка собранного dist/
          tar -czf dist.tar.gz -C dist .

          # Создание целевой директории и загрузка архива
          ssh $SSH_OPTS "${BEGET_USERNAME}@${BEGET_HOST}" "mkdir -p '${TARGET_DIR}'"
          scp $SCP_OPTS dist.tar.gz "${BEGET_USERNAME}@${BEGET_HOST}:${TARGET_DIR}/dist.tar.gz"

          # Атомарная подмена dist_new -> dist без даунтайма
          ssh $SSH_OPTS "${BEGET_USERNAME}@${BEGET_HOST}" "bash -s" << 'EOF'
            set -euo pipefail
            TARGET_DIR="/var/www/contact.sdmaf.ru"

            rm -rf "${TARGET_DIR}/dist_new" "${TARGET_DIR}/dist_old"
            mkdir -p "${TARGET_DIR}/dist_new"
            tar -xzf "${TARGET_DIR}/dist.tar.gz" -C "${TARGET_DIR}/dist_new"
            chmod -R a+rX "${TARGET_DIR}/dist_new"

            if [ -d "${TARGET_DIR}/dist" ]; then
              mv "${TARGET_DIR}/dist" "${TARGET_DIR}/dist_old"
            fi
            mv "${TARGET_DIR}/dist_new" "${TARGET_DIR}/dist"
            rm -rf "${TARGET_DIR}/dist_old" "${TARGET_DIR}/dist.tar.gz"
          EOF

          rm -f ~/.ssh/beget_deploy_key dist.tar.gz
